name: MOR34 environment gates
on:
  push:
    branches: ['codex/mor34-formalization']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lean dependencies
        id: dependencies-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: mor34-linux-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore project build objects
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: mor34-project-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            mor34-project-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Run four readiness gates
        run: python3 scripts/environment_gate.py
      - name: Save Lean dependencies
        if: always() && steps.dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake/packages
          key: mor34-linux-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Save project build objects
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: mor34-project-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Retain actual logs and resolved dependency manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mor34-environment-results
          path: |
            logs/environment_gate/
            lake-manifest.json
          if-no-files-found: warn
